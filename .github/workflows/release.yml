name: release

# release-please reads the conventional commits landed on main and keeps a draft
# "chore(main): release x.y.z" PR open with the CHANGELOG entry. Marking it ready
# and merging cuts the tag and GitHub release.
#
# There is no publish job: Packagist derives versions from git tags via the
# GitHub webhook, so the tag is the publish. The php release-type leaves
# composer.json alone (no "version" key to rewrite, which is what Packagist
# wants) and skips the VERSION file since we don't ship one.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
