name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4"]
        phpunit: ["10", "11", "12"]
        exclude:
          - php: "8.1"
            phpunit: "11"
          - php: "8.1"
            phpunit: "12"
          - php: "8.2"
            phpunit: "12"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer, php-cs-fixer, phpstan

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Enforce PHPUnit version
        run: |
          composer remove --dev phpunit/phpunit --no-interaction || true
          composer require --dev phpunit/phpunit:^${{ matrix.phpunit }} --with-all-dependencies --no-interaction

      - name: Lint & run tests
        run: composer quality
